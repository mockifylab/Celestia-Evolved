name: Create release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_NAME: caelestia-shell-${{ github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build release archive
        run: |
          mkdir -p ".release/$RELEASE_NAME"
          rsync -av --exclude={'.*',nix,flake.lock,flake.nix} . ".release/$RELEASE_NAME"
          echo "$GITHUB_SHA" > ".release/$RELEASE_NAME/REVISION"
          # Authoritative installed-version metadata: the in-app updater reads
          # <install>/VERSION after activation, so a source-tarball install is
          # self-describing without rebuilding the C++ plugin.
          echo "${GITHUB_REF_NAME#v}" > ".release/$RELEASE_NAME/VERSION"
          tar -C .release -czf "$RELEASE_NAME.tar.gz" "$RELEASE_NAME"
          cp "$RELEASE_NAME.tar.gz" caelestia-shell-latest.tar.gz
          # Publish a SHA-256 digest the in-app updater can verify against.
          sha256sum "$RELEASE_NAME.tar.gz" | awk '{print $1}' > "$RELEASE_NAME.tar.gz.sha256"
          echo "RELEASE_SHA256=$(cat "$RELEASE_NAME.tar.gz.sha256")" >> "$GITHUB_ENV"

      - name: Assemble release notes
        run: |
          # Notes are curated per release, not generated by GitHub: the auto
          # changelog is a wall of commit bullets and markdown noise. The digest
          # marker (see below) must stay on the first line because the in-app
          # updater reads it out of the release body.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          {
            printf '<!-- updater-digest sha256:%s -->\n\n' "$RELEASE_SHA256"
            if test -f "$notes"; then
              cat "$notes"
            else
              printf 'No curated notes for %s. See CHANGELOG.md.\n' "$GITHUB_REF_NAME"
            fi
          } > .release/notes.md
          test -s .release/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.RELEASE_NAME }}.tar.gz
            caelestia-shell-latest.tar.gz
            ${{ env.RELEASE_NAME }}.tar.gz.sha256
          body_path: .release/notes.md

      - name: Update stable branch
        run: |
          git branch -f stable "$GITHUB_SHA"
          git push origin stable --force
